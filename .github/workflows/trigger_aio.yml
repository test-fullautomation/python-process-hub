name: Trigger RobotFramework AIO

on:
  pull_request:
      types:
          - opened
          - synchronize
      branches:
          - develop
env:
    GH_TOKEN: ${{ github.token }}

jobs:
  trigger-build-aio:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger RobotFramework AIO
        run: |
          # Get branch created merge request
          PULL_REQUEST_BRANCH="${{ github.head_ref }}"
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://api.github.com/repos/test-fullautomation/RobotFramework_AIO/dispatches \
            --header 'authorization: Bearer ${{ secrets.PAT_THONG }}' \
            -H 'Accept: application/vnd.github.everest-preview+json' \
            --data '{"event_type": "TRIGGER_AIO", "client_payload": { "repository": "'"$GITHUB_REPOSITORY"'", "branch": "'"$PULL_REQUEST_BRANCH"'" }}')

          echo "Dispatch request returned HTTP status: $RESPONSE_CODE"

          if [ "$RESPONSE_CODE" -lt 200 ] || [ "$RESPONSE_CODE" -ge 300 ]; then
            echo "Error: Failed to trigger RobotFramework AIO workflow (HTTP $RESPONSE_CODE)." >&2
            exit 1
          fi

  status-build-aio:
    runs-on: ubuntu-latest
    needs: trigger-build-aio
    timeout-minutes: 90  # Timeout after 90 minutes
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Wait for Build AIO Pipeline Completion
        id: wait-for-pipeline
        run: |
          # Get the recently triggered pipeline ID (filter to repository_dispatch events)
          PIPELINE_ID=$(gh api repos/test-fullautomation/RobotFramework_AIO/actions/runs --jq '.workflow_runs | map(select(.event == "repository_dispatch")) | sort_by(.created_at) | last | .id')
          if [ -z "$PIPELINE_ID" ]; then
            echo "Error: Failed to retrieve PIPELINE_ID from GitHub Actions API."
            exit 1
          fi
          echo "$PIPELINE_ID" > pipeline_id.txt

          # Check the status of the PIPELINE_ID in a loop with basic error handling
          MAX_ATTEMPTS=90  # 90 attempts * 60s = 90 minutes (matches job timeout)
          ATTEMPT=0
          while true; do
            ATTEMPT=$((ATTEMPT + 1))
            STATUS=$(gh api "repos/test-fullautomation/RobotFramework_AIO/actions/runs/$PIPELINE_ID" --jq '.status')
            if [ $? -ne 0 ]; then
              echo "Error: Failed to query pipeline status from GitHub Actions API (attempt $ATTEMPT)."
              exit 1
            fi

            if [ -z "$STATUS" ]; then
              echo "Error: Received empty status from GitHub Actions API for pipeline $PIPELINE_ID (attempt $ATTEMPT)."
              exit 1
            fi

            echo "Current status of pipeline $PIPELINE_ID: $STATUS (attempt $ATTEMPT/$MAX_ATTEMPTS)"

            if [ "$STATUS" = "completed" ]; then
              break
            fi

            if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
              echo "Error: Pipeline $PIPELINE_ID did not reach 'completed' status after $MAX_ATTEMPTS attempts."
              exit 1
            fi
            sleep 60  # If not completed, wait for 60 seconds and check again.
          done


      - name: Get pipeline result
        id: pipeline
        run: |
          # Read the PIPELINE_ID from the saved file
          PIPELINE_ID=$(cat pipeline_id.txt)

          # Get result of pipeline AIO
          gh api repos/test-fullautomation/RobotFramework_AIO/actions/runs/$PIPELINE_ID --jq .conclusion > pipeline_status.txt
          gh api repos/test-fullautomation/RobotFramework_AIO/actions/runs/$PIPELINE_ID --jq .html_url > pipeline_link.txt

      - name: Report status
        run: |
          # Read result from the saved file
          PIPELINE_STATUS=$(cat pipeline_status.txt)
          PIPELINE_LINK=$(cat pipeline_link.txt)

          # Check result pipeline and report
          if [[ "$PIPELINE_STATUS" == "success" ]]; then
            echo "Pipeline RobotFramework AIO success."
            echo "Details at link: $PIPELINE_LINK"
          else
            echo "Pipeline RobotFramework AIO did not succeed."
            echo "Details at link: $PIPELINE_LINK"
            # Notify fail build AIO pipeline
            exit 1
          fi