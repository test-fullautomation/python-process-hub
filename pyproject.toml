[build-system]
requires = ["setuptools>=45", "wheel", "colorama>=0.4.0"]   
build-backend = "setuptools.build_meta"

[project]
name = "ProcessHub"
version = "1.0.0"
description = "Process lifecycle management hub with ZMQ-based coordination"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    { name = "Nguyen Huynh Tri Cuong", email = "Cuong.NguyenHuynhTri@vn.bosch.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Distributed Computing",
]
keywords = ["process", "management", "zmq", "distributed"]

dependencies = [
    "psutil>=5.9.0",
    "pyzmq>=25.0.0",
]

[project.optional-dependencies]
zmq = [
    "pyzmq>=25.0.0",
]
eventbus = [
    "eventbusclient",
    "aio_pika>=9.0.0",
]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "colorama>=0.4.0",
]
all = [
    "python-process-hub[zmq,eventbus,web,dev]",
]

[project.urls]
Homepage = "https://github.com/test-fullautomation/python-process-hub/python-process-hub"
Documentation = "https://github.com/test-fullautomation/python-process-hub/python-process-hub#readme"
Repository = "https://github.com/test-fullautomation/python-process-hub.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["ProcessHub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]
